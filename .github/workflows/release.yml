name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and changelog
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Extract this version's changelog
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
            arch: x64
            binary: mr100-sms-manager-win-x64.exe
          - target: linux-x64
            runner: ubuntu-22.04
            arch: x64
            binary: mr100-sms-manager-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            binary: mr100-sms-manager-linux-arm64
          - target: macos-arm64
            runner: macos-14
            arch: arm64
            binary: mr100-sms-manager-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Use the same resolved runtime version for every release asset.
          node-version: ${{ needs.prepare.outputs.node-version }}
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected build architecture')"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:binary
      - name: Upload tested binary and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify assets and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          test -s notes/release-notes.md
          binaries=(
            mr100-sms-manager-win-x64.exe
            mr100-sms-manager-linux-x64
            mr100-sms-manager-linux-arm64
            mr100-sms-manager-macos-arm64
          )
          assets=()
          for binary in "${binaries[@]}"; do
            test -s "dist/$binary"
            test -s "dist/$binary.sha256"
            (cd dist && sha256sum --check "$binary.sha256")
            assets+=("dist/$binary" "dist/$binary.sha256")
          done
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # With assets, gh creates a draft, uploads all files, then publishes.
          # Never replace an existing published release or implicitly create a tag.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "MR100 SMS Desk $RELEASE_TAG" \
            --notes-file notes/release-notes.md \
            "${flags[@]}"
